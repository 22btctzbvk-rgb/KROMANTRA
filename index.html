<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kromantra | Tienda Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-hover: #4f46e5; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { background: linear-gradient(135deg, #4f46e5, #9333ea); color: white; padding: 30px; text-align: center; border-radius: 12px; margin-bottom: 30px; }
        header img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 8px; border-radius: 50%; background: white; padding: 5px; }
        h1 { margin: 0; font-size: 26px; }
        p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        .container { max-width: 1100px; margin: 0 auto; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #e2e8f0; }
        .card h3 { margin: 0 0 10px 0; font-size: 18px; color: #1e293b; }
        
        .rango-box { font-size: 12px; color: #64748b; background: #f1f5f9; padding: 8px; border-radius: 6px; margin-bottom: 12px; }
        .rango-box ul { margin: 0; padding-left: 15px; }
        
        .form-section { background: #f8fafc; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .form-control { margin-bottom: 10px; }
        .form-control:last-child { margin-bottom: 0; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 13px; background: white; }
        
        .precio-actual { font-size: 18px; font-weight: 700; color: #4f46e5; margin: 10px 0; }
        .aviso-descuento { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; display: none; }
        
        button.btn-comprar { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; }
        button.btn-comprar:hover { background: var(--primary-hover); }
        
        footer { text-align: center; padding: 20px; font-size: 13px; color: #64748b; margin-top: 40px; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.jpg" alt="Logo Kromantra" onerror="this.style.display='none'">
            <h1>Kromantra</h1>
            <p>Sistema Inteligente de Regalos Personalizados y Mayoreo</p>
        </header>

        <h2 style="font-size: 20px; margin-bottom: 20px; color: #334155;">📦 Catálogo de Productos</h2>
        <div id="catalogo" class="grid-productos">
            <p>Cargando productos...</p>
        </div>

        <footer>
            Kromantra © 2026 — Todos los derechos reservados.
        </footer>
    </div>

    <script>
        async function cargarCatalogo() {
            try {
                const res = await fetch('/api/productos');
                const productos = await res.json();
                const container = document.getElementById('catalogo');

                if (productos.length === 0) {
                    container.innerHTML = '<p>No hay productos disponibles por el momento.</p>';
                    return;
                }

                container.innerHTML = productos.map((p, index) => {
                    const precioBase = p.rangos && p.rangos.length > 0 ? p.rangos[0].precio : 0;
                    return `
                        <div class="card" id="card-${index}">
                            <div>
                                <img src="${p.imagen || 'https://via.placeholder.com/300'}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/300?text=Sin+Imagen'">
                                <h3>${p.nombre}</h3>
                                <div class="rango-box">
                                    <b>Precios por volumen:</b>
                                    <ul>
                                        ${(p.rangos || []).map(r => `<li>De ${r.min} a ${r.max} pzas: <b>$${r.precio} c/u</b></li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                            <div>
                                <div class="form-section">
                                    <div class="form-control">
                                        <label>Cantidad de piezas:</label>
                                        <input type="number" id="cant-${index}" value="1" min="1" oninput="calcularPrecio(${index}, ${JSON.stringify(p).replace(/"/g, '&quot;')})">
                                    </div>
                                    
                                    <div class="form-control" style="margin-top: 8px;">
                                        <label>✍️ Texto a grabar / imprimir (Nombre o Frase):</label>
                                        <input type="text" id="texto-${index}" placeholder="Ej. Carlos / 'Feliz Cumpleaños'">
                                    </div>

                                    <div class="form-control" style="margin-top: 8px;">
                                        <label>🎨 Estilo, Color o Variante:</label>
                                        <input type="text" id="estilo-${index}" placeholder="Ej. Color negro mate / Letra cursiva">
                                    </div>

                                    <div class="form-control" style="margin-top: 8px;">
                                        <label>🖼️ Sube tu diseño o logo (Opcional):</label>
                                        <input type="file" id="archivo-${index}" accept="image/*" onchange="convertirDisenoCliente(event, ${index})">
                                        <input type="hidden" id="diseno-base64-${index}">
                                    </div>

                                    <div class="form-control" style="margin-top: 8px;">
                                        <label>💬 Instrucciones especiales para el taller:</label>
                                        <textarea id="nota-${index}" rows="2" placeholder="Ej. Centrar el texto, etc."></textarea>
                                    </div>
                                </div>

                                <div class="precio-actual" id="precio-total-${index}">Total: $${precioBase.toFixed(2)}</div>
                                <div class="aviso-descuento" id="aviso-${index}"></div>
                                <button class="btn-comprar" onclick="realizarPedido(${index}, ${JSON.stringify(p).replace(/"/g, '&quot;')})">Ordenar Pedido 🚀</button>
                            </div>
                        </div>
                    `;
                }).join('');

                productos.forEach((p, index) => calcularPrecio(index, p));

            } catch (err) {
                console.error(err);
                document.getElementById('catalogo').innerHTML = '<p style="color: red;">Error al cargar el catálogo de la tienda.</p>';
            }
        }

        function convertirDisenoCliente(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(`diseno-base64-${index}`).value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function calcularPrecio(index, producto) {
            const cantidadInput = document.getElementById(`cant-${index}`);
            const cantidad = parseInt(cantidadInput.value) || 1;
            const precioTotalDiv = document.getElementById(`precio-total-${index}`);
            const avisoDiv = document.getElementById(`aviso-${index}`);

            if (!producto.rangos || producto.rangos.length === 0) return;

            const rangos = [...producto.rangos].sort((a, b) => a.min - b.min);

            let rangoAplicable = rangos[0];
            for (let r of rangos) {
                if (cantidad >= r.min && cantidad <= r.max) {
                    rangoAplicable = r;
                    break;
                } else if (cantidad > r.max) {
                    rangoAplicable = r;
                }
            }

            const precioUnitario = rangoAplicable.precio;
            const total = cantidad * precioUnitario;
            precioTotalDiv.innerHTML = `Total: $${total.toFixed(2)} <span style="font-size:12px; color:#64748b; font-weight:normal;">($${precioUnitario} c/u)</span>`;

            let siguienteRango = rangos.find(r => r.min > cantidad);
            if (siguienteRango) {
                let piezasFaltantes = siguienteRango.min - cantidad;
                avisoDiv.innerHTML = `💡 ¡Te faltan <b>${piezasFaltantes} pieza(s) más</b> para activar el precio de <b>$${siguienteRango.precio} c/u</b>!`;
                avisoDiv.style.display = 'block';
            } else {
                avisoDiv.innerHTML = `🎉 ¡Felicidades! Tienes el precio máximo de mayoreo aplicado.`;
                avisoDiv.style.display = 'block';
            }
        }

        async function realizarPedido(index, producto) {
            const cantidad = parseInt(document.getElementById(`cant-${index}`).value) || 1;
            const textoPersonalizado = document.getElementById(`texto-${index}`).value.trim();
            const estilo = document.getElementById(`estilo-${index}`).value.trim();
            const notaTaller = document.getElementById(`nota-${index}`).value.trim();
            const disenoCliente = document.getElementById(`diseno-base64-${index}`).value;

            let personalizacionCompleta = '';
            if (textoPersonalizado) personalizacionCompleta += `Texto: "${textoPersonalizado}" `;
            if (estilo) personalizacionCompleta += `| Estilo/Color: ${estilo} `;
            if (notaTaller) personalizacionCompleta += `| Notas: ${notaTaller}`;
            if (!personalizacionCompleta) personalizacionCompleta = 'Sin especificaciones adicionales';

            const rangos = [...producto.rangos].sort((a, b) => a.min - b.min);
            let rangoAplicable = rangos[0];
            for (let r of rangos) {
                if (cantidad >= r.min && cantidad <= r.max) {
                    rangoAplicable = r;
                    break;
                } else if (cantidad > r.max) {
                    rangoAplicable = r;
                }
            }
            const precioUnitario = rangoAplicable.precio;
            const total = cantidad * precioUnitario;

            const nombreCliente = prompt("Ingresa tu Nombre completo para el pedido:");
            if (!nombreCliente) return;
            const telefonoCliente = prompt("Ingresa tu Teléfono de contacto:");
            if (!telefonoCliente) return;

            const datosPedido = {
                cliente: {
                    nombre: nombreCliente,
                    telefono: telefonoCliente
                },
                productos: [
                    {
                        id: producto.id,
                        nombre: producto.nombre,
                        cantidad: cantidad,
                        variante: estilo || 'Estándar',
                        personalizacion: personalizacionCompleta,
                        diseno: disenoCliente, // <--- Se envía el diseño adjunto
                        subtotal: total
                    }
                ],
                total: total
            };

            try {
                const res = await fetch('/api/pedido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosPedido)
                });
                const data = await res.json();
                if (data.exito) {
                    alert(`¡Pedido realizado con éxito! Tu número de folio es #${data.folio}.`);
                    document.getElementById(`texto-${index}`).value = '';
                    document.getElementById(`estilo-${index}`).value = '';
                    document.getElementById(`nota-${index}`).value = '';
                    document.getElementById(`archivo-${index}`).value = '';
                    document.getElementById(`diseno-base64-${index}`).value = '';
                    document.getElementById(`cant-${index}`).value = 1;
                    calcularPrecio(index, producto);
                } else {
                    alert('Error al procesar el pedido.');
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            }
        }

        cargarCatalogo();
    </script>
</body>
</html>
